<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>宠物洗护服务</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #f5f5f5;
            min-height: 100vh;
        }

        .app {
            max-width: 414px;
            margin: 0 auto;
            background-color: #fff;
            min-height: 100vh;
            position: relative;
        }

        /* 页面容器 */
        .page {
            display: none;
            min-height: calc(100vh - 44px);
        }

        .page.active {
            display: block;
        }

        /* 首页头部 */
        .home-header {
            background: linear-gradient(135deg, #0052D9 0%, #0066FF 100%);
            padding: 16px 16px 24px;
            color: white;
        }

        .home-header h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .home-header p {
            font-size: 14px;
            opacity: 0.9;
        }

        /* 宠物选择卡片 */
        .pet-select-card {
            margin: 16px;
            background: white;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            border: 2px solid #E8F3FF;
        }

        .pet-card {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .pet-card img {
            width: 80px;
            height: 80px;
            border-radius: 12px;
            object-fit: cover;
        }

        .pet-card .pet-info {
            flex: 1;
        }

        .pet-card .pet-info h3 {
            font-size: 18px;
            color: #333;
            margin-bottom: 4px;
        }

        .pet-card .pet-info p {
            font-size: 12px;
            color: #999;
            margin-bottom: 8px;
        }

        .pet-tags {
            display: flex;
            gap: 8px;
        }

        .pet-tag {
            padding: 4px 12px;
            border-radius: 100px;
            font-size: 12px;
            font-weight: 500;
        }

        .pet-tag.blue {
            background: #E8F3FF;
            color: #0052D9;
        }

        .switch-btn {
            padding: 6px 14px;
            background: #F5F7FA;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            color: #666;
            cursor: pointer;
        }

        /* 选择项 */
        .select-item {
            margin: 0 16px 12px;
            background: white;
            border-radius: 12px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            border: 1px solid #E5E6EB;
        }

        .select-item .left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .select-item .left i {
            color: #0052D9;
            font-size: 18px;
        }

        .select-item .left .text {
            display: flex;
            flex-direction: column;
        }

        .select-item .left .text .label {
            font-size: 14px;
            color: #333;
        }

        .select-item .left .text .value {
            font-size: 12px;
            color: #999;
            margin-top: 2px;
        }

        .select-item .left .text .value.selected {
            color: #333;
        }

        .select-item .right i {
            color: #C9CDD4;
            font-size: 18px;
        }

        /* 预约按钮 */
        .book-btn {
            margin: 24px 16px;
            background: linear-gradient(135deg, #0052D9 0%, #0066FF 100%);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            width: calc(100% - 32px);
            cursor: pointer;
        }

        .book-btn:disabled {
            background: #C9CDD4;
            cursor: not-allowed;
        }

        /* 服务协议 */
        .service-agreement {
            text-align: center;
            font-size: 12px;
            color: #999;
            margin-bottom: 32px;
        }

        /* 宠物列表页 */
        .pet-list-page .header {
            background: #F5F7FA;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .pet-list-page .header .back-btn {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .pet-list-page .header .back-btn i {
            font-size: 24px;
            color: #333;
        }

        .pet-list-page .header h2 {
            font-size: 18px;
            color: #333;
            flex: 1;
            text-align: center;
        }

        .pet-list-page .header .placeholder {
            width: 32px;
        }

        .pet-list-container {
            padding: 16px;
            min-height: calc(100vh - 180px);
        }

        .pet-list-item {
            background: #E8F3FF;
            border-radius: 12px;
            padding: 16px;
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            position: relative;
            cursor: pointer;
        }

        .pet-list-item.selected {
            border: 2px solid #0052D9;
        }

        .pet-list-item.selected::after {
            content: '';
            position: absolute;
            top: 12px;
            right: 12px;
            width: 20px;
            height: 20px;
            background: #0052D9;
            border-radius: 50%;
        }

        .pet-list-item.selected::before {
            content: '✓';
            position: absolute;
            top: 12px;
            right: 17px;
            color: white;
            font-size: 12px;
            z-index: 1;
        }

        .pet-list-item img {
            width: 80px;
            height: 80px;
            border-radius: 12px;
            object-fit: cover;
        }

        .pet-list-item .info {
            flex: 1;
            margin-left: 16px;
        }

        .pet-list-item .info h4 {
            font-size: 18px;
            color: #333;
            margin-bottom: 4px;
        }

        .pet-list-item .info p {
            font-size: 12px;
            color: #999;
            margin-bottom: 8px;
        }

        .pet-list-footer {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 414px;
            background: white;
            padding: 16px;
            box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.06);
            display: flex;
            gap: 12px;
        }

        .pet-list-footer .btn {
            flex: 1;
            padding: 14px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
        }

        .pet-list-footer .btn.outline {
            background: white;
            border: 2px solid #0052D9;
            color: #0052D9;
        }

        .pet-list-footer .btn.primary {
            background: linear-gradient(135deg, #0052D9 0%, #0066FF 100%);
            border: none;
            color: white;
        }

        /* 底部间距 */
        .bottom-space {
            height: 100px;
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- 首页 -->
        <div class="page active" id="homePage">
            <div class="home-header">
                <h1>Hello</h1>
                <p>欢迎使用宠物洗护服务</p>
            </div>
            
            <div class="pet-select-card">
                <div class="pet-card" id="selectedPetCard" style="display: none;">
                    <img src="https://picsum.photos/200/200?random=1" id="selectedPetImg" alt="宠物">
                    <div class="pet-info">
                        <h3 id="selectedPetName">汪汪</h3>
                        <p id="selectedPetDesc">已经陪伴你3000天</p>
                        <div class="pet-tags">
                            <span class="pet-tag blue" id="selectedPetBreed">柯基犬</span>
                            <span class="pet-tag blue" id="selectedPetAge">6岁</span>
                        </div>
                    </div>
                    <button class="switch-btn" onclick="goToPetList()">切换</button>
                </div>
                <div id="emptyPetCard" style="text-align: center; padding: 32px 16px;">
                    <div style="width: 48px; height: 48px; background: linear-gradient(135deg, #0052D9 0%, #0066FF 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 12px; cursor: pointer;" onclick="goToPetList()">
                        <i class="ri-add-line" style="color: white; font-size: 24px;"></i>
                    </div>
                    <p style="color: #999; font-size: 14px;">点击添加宠物</p>
                </div>
            </div>

            <div class="select-item" onclick="alert('地址选择功能')">
                <div class="left">
                    <i class="ri-map-pin-line"></i>
                    <div class="text">
                        <span class="label">选择上门位置</span>
                        <span class="value" id="addressValue">请选择</span>
                    </div>
                </div>
                <div class="right">
                    <i class="ri-arrow-right-s-line"></i>
                </div>
            </div>

            <div class="select-item" onclick="alert('时间选择功能')">
                <div class="left">
                    <i class="ri-time-line"></i>
                    <div class="text">
                        <span class="label">选择上门服务时间</span>
                        <span class="value" id="timeValue">请选择</span>
                    </div>
                </div>
                <div class="right">
                    <i class="ri-arrow-right-s-line"></i>
                </div>
            </div>

            <button class="book-btn" id="bookBtn" onclick="alert('预约成功！')">立即预约</button>
            
            <div class="service-agreement">服务协议</div>
        </div>

        <!-- 宠物列表页 -->
        <div class="page" id="petListPage">
            <div class="pet-list-page">
                <div class="header">
                    <div class="back-btn" onclick="goBackHome()">
                        <i class="ri-arrow-left-s-line"></i>
                    </div>
                    <h2>我的宠物</h2>
                    <div class="placeholder"></div>
                </div>

                <div class="pet-list-container" id="petListContainer">
                    <!-- 宠物列表项 -->
                </div>

                <div class="bottom-space"></div>

                <div class="pet-list-footer">
                    <button class="btn outline" onclick="alert('添加宠物功能')">添加宠物</button>
                    <button class="btn primary" onclick="confirmSelectPet()">确认选择</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 宠物数据
        let pets = [
            {
                id: 1,
                name: '小黑',
                image: 'https://picsum.photos/200/200?random=1',
                desc: '已经陪伴你3000天',
                breed: '柯基犬',
                age: '6岁'
            },
            {
                id: 2,
                name: '小胖',
                image: 'https://picsum.photos/200/200?random=2',
                desc: '已经陪伴你2000天',
                breed: '英短',
                age: '3岁'
            }
        ];

        let selectedPet = null;

        // 初始化宠物列表
        function initPetList() {
            const container = document.getElementById('petListContainer');
            container.innerHTML = '';
            
            pets.forEach(pet => {
                const item = document.createElement('div');
                item.className = 'pet-list-item' + (selectedPet && selectedPet.id === pet.id ? ' selected' : '');
                item.onclick = () => selectPet(pet);
                item.innerHTML = `
                    <img src="${pet.image}" alt="${pet.name}">
                    <div class="info">
                        <h4>${pet.name}</h4>
                        <p>${pet.desc}</p>
                        <div class="pet-tags">
                            <span class="pet-tag blue">${pet.breed}</span>
                            <span class="pet-tag blue">${pet.age}</span>
                        </div>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        // 选择宠物
        function selectPet(pet) {
            selectedPet = pet;
            initPetList();
        }

        // 确认选择宠物
        function confirmSelectPet() {
            if (selectedPet) {
                document.getElementById('selectedPetCard').style.display = 'flex';
                document.getElementById('emptyPetCard').style.display = 'none';
                document.getElementById('selectedPetImg').src = selectedPet.image;
                document.getElementById('selectedPetName').textContent = selectedPet.name;
                document.getElementById('selectedPetDesc').textContent = selectedPet.desc;
                document.getElementById('selectedPetBreed').textContent = selectedPet.breed;
                document.getElementById('selectedPetAge').textContent = selectedPet.age;
            }
            goBackHome();
        }

        // 页面切换
        function goToPetList() {
            document.getElementById('homePage').classList.remove('active');
            document.getElementById('petListPage').classList.add('active');
            initPetList();
        }

        function goBackHome() {
            document.getElementById('petListPage').classList.remove('active');
            document.getElementById('homePage').classList.add('active');
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            selectedPet = pets[0];
            confirmSelectPet();
        });
    </script>
</body>
</html>
